<h1>更新日志(长截图)</h1>

<div class="version">v28 (2026-11-05)</div>
<ul>
  <li>新增: 悬浮按钮菜单中新增“主页”(点击即可打开应用)</li>
  <li>新增: 取消了截图长度限制，现在可以一直截到页面末尾</li>
  <li>新增: 截图过程中点击“取消”，现在会拼接已截取的部分并显示预览</li>
  <li>改进: 减少了截取长页面时的内存占用</li>
  <li>修复: 修复了在无法滚动的短页面上重复拼接相同内容的问题</li>
  <li>修复: 修复了关闭菜单时短暂闪烁的问题</li>
</ul>

<div class="version">v1 (2026-10-31)</div>
<ul>
  <li>首次发布</li>
</ul>
