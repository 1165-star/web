<h1>更新日誌(長截圖)</h1>

<div class="version">v28 (2026-11-05)</div>
<ul>
  <li>新增: 浮動按鈕選單中新增「首頁」(點擊即可開啟應用程式)</li>
  <li>新增: 取消了截圖長度限制，現在可以一直截到頁面末端</li>
  <li>新增: 截圖過程中點擊「取消」，現在會拼接已截取的部分並顯示預覽</li>
  <li>改進: 減少了截取長頁面時的記憶體用量</li>
  <li>修正: 修正了在無法捲動的短頁面上重複拼接相同內容的問題</li>
  <li>修正: 修正了關閉選單時短暫閃爍的問題</li>
</ul>

<div class="version">v1 (2026-10-31)</div>
<ul>
  <li>首次發布</li>
</ul>
